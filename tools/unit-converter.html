<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit Converter — Pocket Tools</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1020;color:#e8ebf5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
a.back{color:#9aa3bd;text-decoration:none;font-size:14px}
h1{margin:10px 0 4px;font-size:28px}.desc{color:#9aa3bd;margin:0 0 8px}
.card{background:#151b31;border-radius:14px;padding:20px;margin-top:16px}
label{display:block;color:#9aa3bd;font-size:14px;margin:14px 0 6px}label:first-child{margin-top:0}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #2a3352;background:#0b1020;color:#e8ebf5;font-size:16px}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}@media(max-width:560px){.row{grid-template-columns:1fr}}
button{background:#6c5cff;color:#fff;border:0;padding:11px 18px;border-radius:10px;cursor:pointer;font-size:16px}
.res{font-size:26px;font-weight:700;margin-top:18px;line-height:1.4}
.muted{color:#9aa3bd;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../index.html">← All tools</a>
<h1>Unit Converter</h1>
<p class="desc">Length, weight, temperature, data, speed, area and volume — converted live.</p>

<div class="card">
  <label for="cat">Category</label>
  <select id="cat"></select>
  <label for="val">Value</label>
  <input id="val" type="number" value="1" inputmode="decimal">
  <div class="row">
    <div>
      <label for="from">From</label>
      <select id="from"></select>
    </div>
    <div><button id="swap" type="button" title="Swap units">⇄ Swap</button></div>
    <div>
      <label for="to">To</label>
      <select id="to"></select>
    </div>
  </div>
  <div class="res" id="out">—</div>
</div>
</div>

<script>
var $=function(id){return document.getElementById(id)};
// Factors are "how many base units is 1 of this unit". Base units: Length=m, Weight=kg,
// Data=byte (1 KB = 1024 bytes), Speed=m/s, Area=sq m, Volume=litre. Temperature is special-cased.
var CATS={
 'Length':{units:{'Millimetre (mm)':0.001,'Centimetre (cm)':0.01,'Metre (m)':1,'Kilometre (km)':1000,'Inch (in)':0.0254,'Foot (ft)':0.3048,'Yard (yd)':0.9144,'Mile (mi)':1609.344}},
 'Weight':{units:{'Gram (g)':0.001,'Kilogram (kg)':1,'Tonne (t)':1000,'Pound (lb)':0.45359237,'Ounce (oz)':0.028349523125}},
 'Temperature':{units:{'Celsius (°C)':null,'Fahrenheit (°F)':null,'Kelvin (K)':null}},
 'Data':{units:{'Byte (B)':1,'Kilobyte (KB)':1024,'Megabyte (MB)':1048576,'Gigabyte (GB)':1073741824,'Terabyte (TB)':1099511627776}},
 'Speed':{units:{'Metres/sec (m/s)':1,'Kilometres/hour (km/h)':0.2777777777777778,'Miles/hour (mph)':0.44704,'Knot (kn)':0.5144444444444445}},
 'Area':{units:{'Square metre (m²)':1,'Square centimetre (cm²)':0.0001,'Square kilometre (km²)':1000000,'Square foot (ft²)':0.09290304,'Square yard (yd²)':0.83612736,'Acre':4046.8564224,'Hectare (ha)':10000}},
 'Volume':{units:{'Millilitre (ml)':0.001,'Litre (L)':1,'Cubic metre (m³)':1000,'Cubic foot (ft³)':28.316846592,'Gallon US (gal)':3.785411784,'Cup US':0.2365882365}}
};
function toCelsius(v,u){ if(u.indexOf('Celsius')===0) return v; if(u.indexOf('Fahrenheit')===0) return (v-32)*5/9; return v-273.15; }
function fromCelsius(c,u){ if(u.indexOf('Celsius')===0) return c; if(u.indexOf('Fahrenheit')===0) return c*9/5+32; return c+273.15; }
function fmt(n){
  if(n===0) return '0';
  var a=Math.abs(n);
  if(a>=1e15||a<1e-6) return n.toExponential(5);
  return parseFloat(n.toFixed(6)).toLocaleString('en-IN',{maximumFractionDigits:6});
}
function fillUnits(){
  var cat=$('cat').value, names=Object.keys(CATS[cat].units);
  var html=names.map(function(u){return '<option>'+u+'</option>'}).join('');
  $('from').innerHTML=html; $('to').innerHTML=html;
  $('to').selectedIndex = names.length>1 ? 1 : 0;
  calc();
}
function calc(){
  var v=parseFloat($('val').value), cat=$('cat').value, f=$('from').value, t=$('to').value;
  if(isNaN(v)){ $('out').textContent='—'; return; }
  var res;
  if(cat==='Temperature'){ res=fromCelsius(toCelsius(v,f),t); }
  else { res=v*CATS[cat].units[f]/CATS[cat].units[t]; }
  $('out').textContent=fmt(v)+' '+f.split('(')[0].trim()+' = '+fmt(res)+' '+t.split('(')[0].trim();
}
$('cat').innerHTML=Object.keys(CATS).map(function(c){return '<option>'+c+'</option>'}).join('');
$('cat').addEventListener('change',fillUnits);
['val','from','to'].forEach(function(id){ $(id).addEventListener('input',calc); $(id).addEventListener('change',calc); });
$('swap').addEventListener('click',function(){ var i=$('from').selectedIndex; $('from').selectedIndex=$('to').selectedIndex; $('to').selectedIndex=i; calc(); });
fillUnits();
</script>
</body>
</html>
