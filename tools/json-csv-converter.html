<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON ↔ CSV Converter — Pocket Tools</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#0b1020; color:#e8ebf5; }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px 48px; }
  a.back { color:#9aa3bd; text-decoration:none; font-size:14px; }
  a.back:hover { color:#e8ebf5; }
  h1 { font-size:28px; margin:14px 0 6px; }
  .desc { color:#9aa3bd; margin:0 0 20px; }
  .card { background:#151b31; border-radius:14px; padding:20px; margin-bottom:16px; }
  label { display:block; font-size:14px; color:#9aa3bd; margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input[type=file], select { width:100%; padding:10px; border-radius:10px; border:1px solid #2a3352; background:#0b1020; color:#e8ebf5; font-size:15px; }
  textarea { width:100%; min-height:150px; padding:12px; border-radius:10px; border:1px solid #2a3352; background:#0b1020; color:#e8ebf5; font-family: ui-monospace, Menlo, Consolas, monospace; font-size:13.5px; line-height:1.5; resize:vertical; }
  button, .dl { display:inline-block; background:#6c5cff; color:#fff; border:none; padding:12px 20px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; text-decoration:none; margin-top:14px; }
  button.secondary { background:#232c49; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row button { margin-top:10px; }
  .msg { color:#9aa3bd; font-size:14px; margin-top:10px; min-height:20px; line-height:1.55; }
  .bad { color:#f2797a; }
  .good { color:#5fd68a; }
  .tablewrap { overflow-x:auto; margin-top:12px; }
  table { border-collapse:collapse; font-size:13px; min-width:100%; }
  th, td { border:1px solid #2a3352; padding:6px 9px; text-align:left; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  th { background:#0b1020; color:#c6cdea; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← All tools</a>
  <h1>JSON ↔ CSV Converter</h1>
  <p class="desc">Turn a JSON array into a spreadsheet-ready CSV, or a CSV back into JSON. Paste text or load a file — everything happens on your device, offline.</p>

  <div class="card">
    <label for="dir">Direction</label>
    <select id="dir">
      <option value="j2c">JSON → CSV</option>
      <option value="c2j">CSV → JSON</option>
    </select>
    <label for="delim">Delimiter</label>
    <select id="delim">
      <option value=",">Comma (,)</option>
      <option value=";">Semicolon (;)</option>
      <option value="tab">Tab</option>
    </select>
    <label for="file">…or load a file</label>
    <input type="file" id="file" accept=".json,.csv,.txt">
    <label for="input">Input</label>
    <textarea id="input" placeholder="Paste your JSON array or CSV here"></textarea>
    <div class="row">
      <button type="button" id="convert">Convert</button>
      <button type="button" class="secondary" id="sample">Load a sample</button>
    </div>
    <div class="msg" id="msg">Tip: for JSON → CSV, nested objects are written as JSON text inside the cell.</div>
  </div>

  <div class="card" id="outCard" style="display:none">
    <label for="output">Output</label>
    <textarea id="output" readonly></textarea>
    <div class="tablewrap" id="preview"></div>
    <div class="row">
      <button type="button" class="secondary" id="copy">Copy output</button>
      <a class="dl" id="download" href="#">Download</a>
    </div>
  </div>
</div>

<script>
(function(){
  var dirSel = document.getElementById('dir');
  var delimSel = document.getElementById('delim');
  var fileInput = document.getElementById('file');
  var input = document.getElementById('input');
  var output = document.getElementById('output');
  var outCard = document.getElementById('outCard');
  var preview = document.getElementById('preview');
  var msg = document.getElementById('msg');
  var download = document.getElementById('download');
  var currentURL = null;

  function delim(){ return delimSel.value === 'tab' ? '\t' : delimSel.value; }

  /* ---- JSON -> CSV ---- */
  function cellText(v){
    if (v === null || v === undefined) return '';
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  }
  function csvEscape(s, d){
    if (s.indexOf(d) !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1 || s.indexOf('\r') !== -1)
      return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function jsonToCsv(data, d){
    var rows = Array.isArray(data) ? data : [data];
    if (!rows.length) throw new Error('The JSON array is empty.');
    var keys = [], seen = {};
    rows.forEach(function(r){
      if (r === null || typeof r !== 'object' || Array.isArray(r))
        throw new Error('JSON → CSV needs an array of objects, like [{"name":"Asha","age":21}, …].');
      Object.keys(r).forEach(function(k){ if (!seen[k]) { seen[k] = 1; keys.push(k); } });
    });
    var lines = [keys.map(function(k){ return csvEscape(k, d); }).join(d)];
    rows.forEach(function(r){
      lines.push(keys.map(function(k){ return csvEscape(cellText(r[k]), d); }).join(d));
    });
    return { text: lines.join('\r\n'), headers: keys, rows: rows.map(function(r){ return keys.map(function(k){ return cellText(r[k]); }); }) };
  }

  /* ---- CSV -> JSON (proper quoted-field parser) ---- */
  function parseCsv(text, d){
    var rows = [], row = [], field = '', inQ = false, i = 0;
    text = text.replace(/^\uFEFF/, '');
    while (i < text.length) {
      var ch = text[i];
      if (inQ) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += ch; i++; continue;
      }
      if (ch === '"') { inQ = true; i++; continue; }
      if (ch === d) { row.push(field); field = ''; i++; continue; }
      if (ch === '\r') { i++; continue; }
      if (ch === '\n') { row.push(field); field = ''; rows.push(row); row = []; i++; continue; }
      field += ch; i++;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function(r){ return !(r.length === 1 && r[0] === ''); });
  }
  function csvToJson(text, d){
    var rows = parseCsv(text, d);
    if (rows.length < 1) throw new Error('No rows found in that CSV.');
    var headers = rows[0].map(function(h, idx){
      h = h.trim() || ('column' + (idx + 1));
      return h;
    });
    var used = {}, objs = [];
    headers = headers.map(function(h){
      if (used[h]) { var n = ++used[h]; return h + '_' + n; }
      used[h] = 1; return h;
    });
    for (var r = 1; r < rows.length; r++) {
      var obj = {};
      headers.forEach(function(h, c){ obj[h] = rows[r][c] !== undefined ? rows[r][c] : ''; });
      objs.push(obj);
    }
    return { objs: objs, headers: headers, rows: rows.slice(1) };
  }

  function showPreview(headers, rows){
    var html = '<table><thead><tr>' + headers.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.slice(0, 10).forEach(function(r){
      html += '<tr>' + r.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
    });
    html += '</tbody></table>';
    if (rows.length > 10) html += '<div class="msg">Preview: first 10 of ' + rows.length + ' rows. The download has them all.</div>';
    preview.innerHTML = html;
  }
  function esc(s){
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function convert(){
    var d = delim(), text = input.value;
    if (!text.trim()) { msg.innerHTML = '<span class="bad">Paste something first.</span>'; return; }
    try {
      if (dirSel.value === 'j2c') {
        var data = JSON.parse(text);
        var res = jsonToCsv(data, d);
        output.value = res.text;
        showPreview(res.headers, res.rows);
        setDownload(res.text, 'converted.csv', 'text/csv');
        msg.innerHTML = '<span class="good">Converted.</span> ' + res.rows.length + ' rows × ' + res.headers.length + ' columns.';
      } else {
        var out = csvToJson(text, d);
        var json = JSON.stringify(out.objs, null, 2);
        output.value = json;
        showPreview(out.headers, out.rows);
        setDownload(json, 'converted.json', 'application/json');
        msg.innerHTML = '<span class="good">Converted.</span> ' + out.objs.length + ' objects. All values are strings, exactly as in the CSV.';
      }
      outCard.style.display = 'block';
    } catch (e) {
      outCard.style.display = 'none';
      msg.innerHTML = '<span class="bad">' + esc(e.message) + '</span>';
    }
  }

  function setDownload(text, name, type){
    if (currentURL) URL.revokeObjectURL(currentURL);
    currentURL = URL.createObjectURL(new Blob([text], { type: type }));
    download.href = currentURL;
    download.download = name;
  }

  document.getElementById('convert').addEventListener('click', convert);
  document.getElementById('sample').addEventListener('click', function(){
    if (dirSel.value === 'j2c') {
      input.value = '[{"name":"Asha","city":"Varanasi","marks":91},{"name":"Rohan","city":"Delhi","marks":87,"club":"Coding"}]';
    } else {
      input.value = 'name,city,note\nAsha,Varanasi,"likes ""quoted"" text, and commas"\nRohan,Delhi,plain';
    }
    convert();
  });
  document.getElementById('copy').addEventListener('click', function(){
    output.select();
    var done = function(){ msg.innerHTML = '<span class="good">Copied to clipboard.</span>'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(output.value).then(done, function(){ document.execCommand('copy'); done(); });
    else { document.execCommand('copy'); done(); }
  });
  fileInput.addEventListener('change', function(){
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    if (/\.csv$/i.test(f.name)) dirSel.value = 'c2j';
    if (/\.json$/i.test(f.name)) dirSel.value = 'j2c';
    f.text().then(function(t){ input.value = t; convert(); });
  });
})();
</script>
</body>
</html>
